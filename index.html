<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Персональный Сайт</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #007aff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f4f7f6;
            --card-bg: #1e1e1e;
            --accent-color: #ff9500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vi;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .theme-toggle {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #007aff, #ff9500);
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        h1 { margin: 10px 0; font-size: 24px; }
        p { color: #666; line-height: 1.6; }
        [data-theme="dark"] p { color: #aaa; }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        input, textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        button[type="submit"] {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 18px;">MyWebSpace</div>
        <button class="theme-toggle" onclick="toggleTheme()">Сменить тему</button>
    </header>

    <div class="container">
        <div class="card">
            <div class="profile-img"></div>
            <h1>Привет, я ваш новый сайт!</h1>
            <p>Это заготовка современного адаптивного лендинга. Вы можете легко изменить этот текст, добавить свои фотографии и ссылки в коде файла.</p>
        </div>

        <div class="card">
            <h3>Связаться со мной</h3>
            <form onsubmit="sendMessage(event)">
                <input type="text" id="name" placeholder="Ваше имя" required>
                <input type="email" id="email" placeholder="Ваш Email" required>
                <textarea id="message" rows="4" placeholder="Ваше сообщение..." required></textarea>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div >

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function sendMessage(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            alert(`Спасибо, ${name}! Ваше демо-сообщение успешно "отправлено" (имитация).`);
            event.target.reset();
        }
    </script>
</body>
</html>
