

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мемный Кот-Кликер</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #111119);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00f0ff;
        }

        /* Кнопка-Кот */
        .click-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #252538;
            border: 4px solid #ff007f;
            font-size: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto 25px;
            transition: transform 0.05s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
        }

        .click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        /* Магазин */
        .shop-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .shop-btn {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: background 0.2s;
        }

        .shop-btn:hover { background: #00c8d7; }
        .shop-btn:disabled {
            background: #444;
            color: #88px;
            cursor: not-allowed;
        }

        /* Вылетающий текст */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 22px;
            color: #00f0ff;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Кот-Мемер 🐾</h1>
        <div class="score-board">Тыков: <span id="score">0</span></div>

        <!-- Кот меняет эмоцию при нажатии -->
        <div id="cat-btn" class="click-btn" onmousedown="meow(event)" onmouseup="resetCat()">🐱</div>

        <div class="shop-box">
            <p style="margin: 0 0 10px 0; font-size: 14px; color: #aaa;">Улучшение клика (Дает +1 к тыку)</p>
            <button id="upgrade-btn" class="shop-btn" onclick="buyUpgrade()">Купить Валерьянку (Цена: 15)</button>
        </div>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let upgradeCost = 15;

        // Встроенная синтезированная озвучка (Web Audio API)
        // Компонует забавный звук «Мяу/Пиу» без использования внешних файлов
        function playSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'triangle'; // Мягкий мультяшный звук
            
            // Быстрое изменение частоты вверх для эффекта "мяу/пиу"
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.15);
            
            // Затухание громкости
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }

        function meow(event) {
            score += clickPower;
            document.getElementById('score').innerText = score;
            
            // Меняем эмоцию кота
            document.getElementById('cat-btn').innerText = '🙀';
            
            // Запускаем озвучку
            playSound();
            
            // Создаем вылетающий текст
            createFloatingText(event.clientX, event.clientY);
            
            // Проверяем доступность улучшений
            checkShop();
        }

        function resetCat() {
            document.getElementById('cat-btn').innerText = '😼';
        }

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${clickPower}`;
            text.style.left = `${x - 20}px`;
            text.style.top = `${y - 20}px`;
            
            // Случайный цвет для фана
            const colors = ['#00f0ff', '#ff007f', '#00ff66', '#ff9500'];
            text.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 600);
        }

        function buyUpgrade() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.round(upgradeCost * 1.8);
                
                document.getElementById('score').innerText = score;
                document.getElementById('upgrade-btn').innerText = `Купить Валерьянку (Цена: ${upgradeCost})`;
                
                checkShop();
                
                // Звуковой эффект покупки (чуть ниже тоном)
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        }

        function checkShop() {
            const btn = document.getElementById('upgrade-btn');
            if (score >= upgradeCost) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        // Первая проверка при запуске
        checkShop();
    </script>
</body>
</html>
