
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Леры ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(251, 111, 146, 0.3);
            border: 2px solid #ffb3c6;
            max-width: 400px;
            width: 85%;
            z-index: 10;
        }

        h1 {
            color: #fb6f92;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .flower-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .btn {
            background: #fb6f92;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 111, 146, 0.4);
        }

        .btn-more {
            background: transparent;
            color: #ff477e;
            border: 2px solid #ff477e;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
        }

        .hidden-content {
            display: none;
        }

        .love-text {
            color: #ff477e;
            font-size: 1.7rem;
            font-weight: bold;
            margin-top: 15px;
        }

        .sister-text {
            color: #fb6f92;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .compliment {
            color: #ff7096;
            font-size: 1.1rem;
            margin-top: 15px;
            font-style: italic;
        }

        .petal {
            position: absolute;
            background-color: #ffb3c6;
            border-radius: 150px 0px 150px 150px;
            opacity: 0.7;
            pointer-events: none;
            animation: fade 5s linear infinite;
        }

        @keyframes fade {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(100px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="flower-icon">🌸✨🌸</div>
        
        <div id="intro">
            <h1>Для Леры</h1>
            <p>Здесь прячется кое-что очень важное.<br>Нажми на кнопку ниже.</p>
            <button class="btn" onclick="revealLove()">Нажми меня ✨</button>
        </div>

        <div id="secret" class="hidden-content">
            <div class="love-text">Лера, я тебя люблю! ❤️</div>
            <div class="sister-text">Ты самая лучшая сестра в мире! 👑</div>
            <div class="compliment" id="complimentText">Ты невероятно добрая и чуткая! ✨</div>
            <button class="btn-more" onclick="nextCompliment()">Ещё комплимент 💖</button>
            <div style="font-size: 40px; margin-top: 15px;">🌹🌹🌹</div>
        </div>
    </div>

    <script>
        const compliments = [
            "Ты невероятно добрая и чуткая! ✨",
            "С тобой всегда тепло и уютно! ☕",
            "У тебя самое доброе сердце на свете! 💖",
            "Ты умеешь поднимать настроение одной улыбкой! 😊",
            "Я очень горжусь тем, что ты моя сестра! 💪",
            "Ты безумно талантливая и умная! 🧠",
            "Твой смех — самый лучший звук! 🎉",
            "Ты всегда находишь нужные слова поддержки! 🤝",
            "Ты яркая, как самое теплое солнышко! ☀️",
            "Мне безумно повезло с сестрой! 🍀"
        ];

        let index = 0;

        function revealLove() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('secret').style.display = 'block';
            setInterval(createPetal, 200);
        }

        function nextCompliment() {
            index = (index + 1) % compliments.length;
            document.getElementById('complimentText').innerText = compliments[index];
            for(let i = 0; i < 3; i++) {
                createPetal();
            }
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const size = Math.random() * 15 + 10;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * window.innerWidth + 'px';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            const colors = ['#ffb3c6', '#ff85a1', '#ffc2d1', '#ff7096'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(petal);

            setTimeout(() => { petal.remove(); }, 5000);
        }
    </script>
</body>
</html>
