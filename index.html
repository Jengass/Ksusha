<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СОНЯ.NET — Официальный Сонь-Центр</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .domain-badge {
            background: #00b4d8;
            color: #0b132b;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.5);
        }

        header h1 {
            font-size: 3rem;
            text-align: center;
            background: linear-gradient(45deg, #00f5d4, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #90e0ef;
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            max-width: 800px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00f5d4;
            border-bottom: 2px solid rgba(0, 245, 212, 0.2);
            padding-bottom: 10px;
        }

        /* Интерактивные цитаты Сони */
        .sonya-quotes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .quote-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: left;
        }

        .quote-btn:hover {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.4);
        }

        /* Генератор фактов */
        .fact-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
            color: #00f5d4;
            border-left: 4px solid #00f5d4;
        }

        .action-btn {
            background: linear-gradient(45deg, #00f5d4, #00b4d8);
            border: none;
            padding: 15px 30px;
            color: #0b132b;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.4);
        }

        .action-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.6);
            transform: scale(1.02);
        }

        /* Настройки голоса */
        .voice-settings {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
        }

        select {
            background: #1c2541;
            color: white;
            border: 1px solid #00f5d4;
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
        }

        footer {
            margin-top: 5px;
            color: #5c677d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="domain-badge">СОНЯ.NET</div>
    <header>
        <h1>Главный Портал про Соню</h1>
        <div class="subtitle">Официальное представительство Сони во Вселенной 🚀</div>
    </header>

    <div class="main-grid">
        <!-- Блок 1: Говорящие цитаты -->
        <div class="card">
            <h2>📢 Говорящие цитаты Сони</h2>
            <p style="margin-bottom: 15px; color: #a0aec0;">Кликните по карточке, чтобы услышать Соню:</p>
            <div class="sonya-quotes">
                <button class="quote-btn" onclick="speak('Привет всем! Я Соня, и вы находитесь на моём лучшем личном сайте соня точка нет. Рада вас видеть!')">
                    ✨ Приветствие Сони
                </button>
                <button class="quote-btn" onclick="speak('Тише, тише. Гениальные мысли требуют идеальной тишины. Дайте Соне подумать.')">
                    🤫 Режим гения
                </button>
                <button class="quote-btn" onclick="speak('Я не спорю, я просто детально объясняю, почему я абсолютно права в этой ситуации.')">
                    🔥 Железный аргумент
                </button>
                <button class="quote-btn" onclick="speak('Мой главный секрет успеха прост: побольше спать, поменьше переживать из-за ерунды.')">
                    🧘 Философия жизни
                </button>
            </div>
        </div>

        <!-- Блок 2: Генератор случайных фактов -->
        <div class="card">
            <h2>🔮 Случайный факт о Соне</h2>
            <div class="fact-box" id="fact-container">Нажмите на кнопку ниже, чтобы узнать секретное досье на Соню...</div>
            <button class="action-btn" onclick="generateFact()">Сгенерировать и озвучить факт</button>
        </div>

        <!-- Настройки голоса -->
        <div class="voice-settings">
            <label for="voice-select">⚙️ Выбрать голос:</label>
            <select id="voice-select"></select>
        </div>
    </div>

    <footer style="margin-top: 40px; text-align: center; color: #a0aec0;">
        <p>© 2026 Соня.net. Все права защищены Соней лично.</p>
    </footer>

<script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voice-select');
    let voices = [];

    // База убойных фактов о Соне
    const sonyaFacts = [
        "Соня способна генерировать гениальные идеи со скоростью три штуки в секунду.",
        "Уровень обаяния Сони официально зашкаливает и не поддается никаким научным измерениям.",
        "Если Соня молчит — это не значит, что ей нечего сказать. Она просто просчитывает траекторию захвата галактики.",
        "Научный факт: Соня может спать в любой позе, в любом месте и при любом уровне шума.",
        "Секретное оружие Сони — это её убийственный взгляд, перед которым невозможно устоять.",
        "Соня всегда знает, где продается самый вкусный кофе и лучшие вкусняшки.",
        "Когда Соне лень что-то делать, это называется не прокрастинация, а энергосберегающий режим."
    ];

    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        voices.forEach((voice) => {
            if(voice.lang.includes('ru') || voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                if(voice.lang.includes('ru')) option.selected = true;
                voiceSelect.appendChild(option);
            }
        });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function speak(text) {
        if (synth.speaking) synth.cancel();
        
        const utterThis = new SpeechSynthesisUtterance(text);
        const selectedVoiceName = voiceSelect.selectedOptions?.getAttribute('data-name');
        
        voices.forEach((voice) => {
            if(voice.name === selectedVoiceName) utterThis.voice = voice;
        });
        
        utterThis.rate = 1.0;
        synth.speak(utterThis);
    }

    function generateFact() {
        const randomIndex = Math.floor(Math.random() * sonyaFacts.length);
        const fact = sonyaFacts[randomIndex];
        document.getElementById('fact-container').innerText = fact;
        speak(fact);
    }
</script>

</body>
</html>
