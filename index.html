
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZON — Мега-Маркетплейс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Golos Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f2f4f7;
            color: #101114;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e5ed;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #001a34;
        }

        .geo-delivery select {
            border: none;
            color: #005bff;
            font-weight: 600;
            background: none;
            outline: none;
            cursor: pointer;
        }

        .header-main {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #005bff;
            cursor: pointer;
            letter-spacing: -1px;
        }

        .logo span { color: #ff0055; }

        .search-bar { flex-grow: 1; position: relative; }

        .search-bar input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #005bff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #808d9a;
        }

        .nav-buttons { display: flex; gap: 20px; align-items: center; }

        .nav-btn {
            background: none;
            border: none;
            color: #001a34;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            gap: 4px;
        }

        .nav-btn:hover { color: #005bff; }
        .nav-btn-icon { font-size: 22px; }

        .badge {
            position: absolute;
            top: -5px;
            right: 5px;
            background-color: #ff0055;
            color: white;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }

        .sidebar {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
            border: 1px solid #e0e5ed;
        }

        .sidebar h3 { font-size: 16px; margin-bottom: 12px; color: #001a34; }

        .filter-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 10px 8px;
            font-size: 14px;
            color: #4d5f71;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.15s;
        }

        .filter-btn:hover { background: #f2f4f7; color: #005bff; }
        .filter-btn.active { background: #e6f0ff; color: #005bff; font-weight: 600; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e5ed;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
            transition: box-shadow 0.2s;
        }

        .product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

        .favorite-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.8);
            border: none;
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .favorite-icon.active { color: #ff0055; }

        .product-img-placeholder {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            background-color: #f7f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .price-block { margin-bottom: 8px; }
        .ozon-card-price { font-size: 20px; font-weight: 800; color: #00b06c; }
        .ozon-card-label { font-size: 11px; background-color: #e6f7f0; color: #00b06c; padding: 1px 4px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
        .default-price { font-size: 14px; color: #707f8d; text-decoration: line-through; margin-top: 2px; }

        .product-title {
            font-size: 14px;
            color: #101114;
            line-height: 1.4;
            margin-bottom: 12px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .add-to-cart {
            background-color: #005bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .add-to-cart:hover { background-color: #004dd6; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,26,52,0.5);
            justify-content: center; align-items: center; z-index: 200;
        }

        .modal-content {
            background: white; padding: 24px; border-radius: 16px;
            width: 90%; max-width: 550px; max-height: 85vh;
            overflow-y: auto; position: relative;
        }

        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #808d9a; }

        .cart-item {
            display: grid; grid-template-columns: auto 1fr auto auto;
            align-items: center; gap: 15px; padding: 15px 0;
            border-bottom: 1px solid #e0e5ed;
        }

        .cart-item-qty {
            display: flex; align-items: center; gap: 8px;
            background: #f2f4f7; padding: 4px 8px; border-radius: 6px;
        }

        .qty-btn { background: none; border: none; font-weight: bold; font-size: 16px; cursor: pointer; width: 20px; color: #005bff; }
        .promo-block { margin-top: 15px; display: flex; gap: 10px; }
        .promo-block input { flex-grow: 1; padding: 8px 12px; border: 1px solid #e0e5ed; border-radius: 6px; }
        .promo-block button { background: #101114; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .cart-total { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: right; border-top: 2px solid #f2f4f7; padding-top: 15px; }
        .checkout-btn { background: #ff0055; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        .payment-form { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .payment-form input { padding: 12px; border: 1px solid #e0e5ed; border-radius: 8px; }
        .pay-submit-btn { background: #005bff; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Кастомное всплывающее уведомление */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #001a34;
            color: white;
            padding: 16px 28px;
            border-radius: 10px;
            z-index: 300;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            font-size: 14px;
            font-weight: 500;
            border-left: 5px solid #005bff;
            max-width: 350px;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { display: flex; overflow-x: auto; gap: 8px; padding: 8px; }
            .filter-btn { white-space: nowrap; }
            .header-top { display: none; }
        }
    </style>
</head>
<body>

    <!-- Всплывающий Тост -->
    <div id="toastNotification" class="toast"></div>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="geo-delivery">
                    <span>Город: 
                        <select id="citySelect" onchange="updatePvzOptions()">
                            <option value="Москва">Москва</option>
                            <option value="Санкт-Петербург">Санкт-Петербург</option>
                        </select>
                    </span>
                    <span>ПВЗ: <select id="pvzSelect"></select></span>
                </div>
                <div>Доставка за 1 день • Новинки 2026</div>
            </div>
            <div class="header-main">
                <div class="logo" onclick="filterCategory('all')">OZON<span>.</span></div>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Искать айфоны, микросхемы, лежанки..." oninput="searchProducts()">
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="toggleFavoritesModal(true)">
                        <span class="nav-btn-icon">❤️</span><span>Избранное</span><span class="badge" id="favCount">0</span>
                    </button>
                    <button class="nav-btn" onclick="toggleCart(true)">
                        <span class="nav-btn-icon">🛒</span><span>Корзина</span><span class="badge" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Категории</h3>
            <button class="filter-btn active" onclick="filterCategory('all', this)">Все категории</button>
            <button class="filter-btn" onclick="filterCategory('phones', this)">📱 Смартфоны Apple</button>
            <button class="filter-btn" onclick="filterCategory('chips', this)">⚡ Микросхемы и Техника</button>
            <button class="filter-btn" onclick="filterCategory('other', this)">📦 Разное и Зоотовары</button>
        </aside>

        <main class="products-grid" id="productsGrid"></main>
    </div>

    <!-- Модалка Корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleCart(false)">&times;</span>
            <h2>Корзина</h2>
            <div id="cartItemsList" style="margin-top: 15px;"></div>
            <div class="promo-block">
                <input type="text" id="promoInput" placeholder="Промокод (OZON2026)">
                <button onclick="applyPromo()">Применить</button>
            </div>
            <div class="cart-total" id="cartTotalSum">Итого: 0 ₽</div>
            <button class="checkout-btn" onclick="openPaymentModal()">Перейти к оформлению</button>
        </div>
    </div>

    <!-- Модалка Избранного -->
    <div class="modal" id="favModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleFavoritesModal(false)">&times;</span>
            <h2>Избранное</h2>
            <div id="favItemsList" style="margin-top: 15px; display: grid; gap: 10px;"></div>
        </div>
    </div>

    <!-- Оплата -->
    <div class="modal" id="paymentModal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" onclick="togglePayment(false)">&times;</span>
            <h2 style="color: #005bff; text-align: center;">Ozon Оплата</h2>
            <p id="paymentTargetPvz" style="font-size: 12px; color: #707f8d; margin-top: 5px; text-align: center;"></p>
            <div style="font-size: 26px; font-weight: bold; text-align: center; margin: 15px 0; color:#00b06c;" id="paymentSum">0 ₽</div>
            <div class="payment-form">
                <input type="text" id="cardNumber" placeholder="Номер карты" maxlength="19" oninput="formatCardNumber(this)">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="cardExpiry" placeholder="ММ/ГГ" maxlength="5" style="width:50%;">
                    <input type="password" id="cardCvv" placeholder="CVV" maxlength="3" style="width:50%;">
                </div>
                <button class="pay-submit-btn" onclick="processPayment()">Оплатить заказ</button>
            </div>
        </div>
    </div>

    <script>
        const pvzData = {
            "Москва": ["ул. Арбат, д. 2", "пр-т Мира, д. 15"],
            "Санкт-Петербург": ["Невский пр-т, д. 45", "ул. Садовая, д. 12"]
        };

        // Обновленная база данных с телефонами, чипами и разным + кастомные месседжи
        const products = [
            // Смартфоны
            { id: 1, title: "Смартфон Apple iPhone 13 128GB (Темная ночь)", price: 55000, category: "phones", img: "📱", msgCart: "Классика! iPhone 13 добавлен. Проверенный временем выбор.", msgFav: "Вы сохранили iPhone 13. Цена на него сейчас отличная!" },
            { id: 2, title: "Смартфон Apple iPhone 14 Pro 256GB", price: 82000, category: "phones", img: "📲", msgCart: "Dynamic Island ждет вас! iPhone 14 Pro отправлен в корзину.", msgFav: "iPhone 14 Pro добавлен в список желаний ❤️" },
            { id: 3, title: "Смартфон Apple iPhone 15 Pro Max 512GB", price: 124000, category: "phones", img: "👑", msgCart: "Титановый флагман! iPhone 15 Pro Max добавлен. Отличный выбор камер.", msgFav: "Флагман в избранном! Ждем снижения цены?" },
            { id: 4, title: "Смартфон Apple iPhone 16 Pro 256GB", price: 145000, category: "phones", img: "💎", msgCart: "Кнопка Camera Control в деле! iPhone 16 Pro добавлен в корзину.", msgFav: "iPhone 16 Pro добавлен в избранное." },
            { id: 5, title: "Смартфон Apple iPhone 17 Pro Max 1TB (Эксклюзив 2026)", price: 199000, category: "phones", img: "🚀", msgCart: "Шок! Новейший iPhone 17 Pro Max забронирован за вами на складе!", msgFav: "Вы добавили в избранное будущее — iPhone 17 Pro Max! 🌌" },
            
            // Техника и микросхемы
            { id: 6, title: "Микросхема логическая NE555 (Комплект 10 шт)", price: 350, category: "chips", img: "👾", msgCart: "Таймеры NE555 добавлены. Идеально для ваших инженерных схем!", msgFav: "NE555 в избранном. Пора собирать плату!" },
            { id: 7, title: "Плата развития Микроконтроллер (Аналог Arduino Uno R3)", price: 850, category: "chips", img: "🔌", msgCart: "Контроллер в корзине. Внимание: берегите компоненты от статического электричества! ⚡", msgFav: "Контроллер сохранен. Кажется, кто-то готовит крутой проект!" },
            { id: 8, title: "Набор резисторов и конденсаторов для пайки (600 шт)", price: 600, category: "chips", img: "📟", msgCart: "Компоненты добавлены. Полный набор радиолюбителя готов к отправке.", msgFav: "Набор деталей сохранен в закладках." },
            
            // Разное и зоотовары
            { id: 9, title: "Прозрачный силиконовый чехол с MagSafe для iPhone", price: 1200, category: "other", img: "🛡️", msgCart: "Чехол добавлен. Защита для вашего смартфона — это важно!", msgFav: "Чехол отложен в избранное." },
            { id: 10, title: "Миска для собак двойная на металлической подставке", price: 1450, category: "other", img: "🥣", msgCart: "Миска добавлена в корзину! Ваш пес скажет вам спасибо за удобный обед 🐕", msgFav: "Миска сохранена. Порадуйте питомца обновкой!" },
            { id: 11, title: "Мягкая лежанка для собак и кошек Premium (70х50 см)", price: 2800, category: "other", img: "🛏️", msgCart: "Уютная лежанка в корзине! Хвостику будет супер-комфортно и тепло спать 🐾", msgFav: "Лежанка в избранном. Самое уютное место для сна питомца." }
        ];

        let cart = {}; let favorites = []; let currentCategory = 'all'; let discountMultiplier = 1.0;

        function showCustomToast(text, isMagenta = false) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = text;
            toast.style.borderLeftColor = isMagenta ? '#ff0055' : '#005bff';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function updatePvzOptions() {
            const city = document.getElementById('citySelect').value;
            const pvzSelect = document.getElementById('pvzSelect');
            pvzSelect.innerHTML = '';
            pvzData[city].forEach(pvz => {
                const opt = document.createElement('option');
                opt.value = pvz; opt.innerText = pvz;
                pvzSelect.appendChild(opt);
            });
        }

        function renderProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if(productsToDisplay.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #808d9a;">Товары не найдены</p>';
                return;
            }
            productsToDisplay.forEach(product => {
                const isFav = favorites.includes(product.id) ? 'active' : '';
                const cardPrice = Math.floor(product.price * 0.85);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <button class="favorite-icon ${isFav}" onclick="toggleFavorite(${product.id}, this)">❤️</button>
                    <div class="product-img-placeholder">${product.img}</div>
                    <div class="price-block">
                        <div><span class="ozon-card-price">${cardPrice.toLocaleString()} ₽</span><span class="ozon-card-label">Ozon Карта</span></div>
                        <div class="default-price">${product.price.toLocaleString()} ₽ обычная</div>
                    </div>
                    <div class="product-title">${product.title}</div>
                    <button class="add-to-cart" onclick="addToCart(${product.id})">В корзину</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, buttonElement) {
            currentCategory = category;
            if(buttonElement) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.add('active');
            }
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);
            renderProducts(filtered);
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query) && (currentCategory === 'all' || p.category === currentCategory));
            renderProducts(filtered);
        }

        function addToCart(productId) {
            cart[productId] = (cart[productId] || 0) + 1;
            updateCartCounter();
            
            // Берем кастомное сообщение товара
            const product = products.find(p => p.id === productId);
            showCustomToast(product.msgCart || "Товар добавлен в корзину!");
        }

        function changeQty(productId, amount) {
            if (!cart[productId]) return;
            cart[productId] += amount;
            if (cart[productId] <= 0) delete cart[productId];
            updateCartCounter(); renderCartItems();
        }

        function updateCartCounter() {
            document.getElementById('cartCount').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
        }

        function toggleFavorite(productId, element) {
            const index = favorites.indexOf(productId);
            const product = products.find(p => p.id === productId);
            if (index > -1) {
                favorites.splice(index, 1);
                element.classList.remove('active');
                showCustomToast(`💔 Удалено: ${product.title}`, true);
            } else {
                favorites.push(productId);
                element.classList.add('active');
                showCustomToast(product.msgFav || "Добавлено в избранное!", true);
            }
            document.getElementById('favCount').innerText = favorites.length;
        }

        function toggleFavoritesModal(show) {
            document.getElementById('favModal').style.display = show ? 'flex' : 'none';
            if(show) {
                const list = document.getElementById('favItemsList'); list.innerHTML = '';
                if(favorites.length === 0) { list.innerHTML = '<p style="color:#707f8d; text-align:center;">Тут пока ничего нет</p>'; return; }
                favorites.forEach(id => {
                    const item = products.find(p => p.id === id);
                    const row = document.createElement('div');
                    row.style = 'display:flex; justify-content:space-between; align-items:center; background:#f2f4f7; padding:10px; border-radius:8px;';
                    row.innerHTML = `<span>${item.img} ${item.title}</span><button onclick="addToCart(${item.id})" style="background:#005bff; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">В корзину</button>`;
                    list.appendChild(row);
                });
            }
        }

        function toggleCart(show) {
            document.getElementById('cartModal').style.display = show ? 'flex' : 'none';
            if (show) renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList'); const totalSumEl = document.getElementById('cartTotalSum');
            list.innerHTML = ''; let totalSum = 0;
            for (let id in cart) {
                const product = products.find(p => p.id == id); const count = cart[id];
                const cardPrice = Math.floor(product.price * 0.85); const cost = cardPrice * count;
                totalSum += cost;
                const row = document.createElement('div'); row.className = 'cart-item';
                row.innerHTML = `
                    <span style="font-size:24px;">${product.img}</span>
                    <div><div style="font-weight:600; font-size:14px;">${product.title}</div><div style="color:#00b06c; font-size:12px;">${cardPrice.toLocaleString()} ₽</div></div>
                    <div class="cart-item-qty">
                        <button class="qty-btn" onclick="changeQty(${product.id}, -1)">−</button>
                        <span style="font-weight:600; font-size:14px;">${count} шт.</span>
                        <button class="qty-btn" onclick="changeQty(${product.id}, 1)">+</button>
                    </div>
                    <strong>${cost.toLocaleString()} ₽</strong>
                `;
                list.appendChild(row);
            }
            totalSum = Math.floor(totalSum * discountMultiplier);
            totalSumEl.innerText = `Итого к оплате: ${totalSum.toLocaleString()} ₽`;
            if (Object.keys(cart).length === 0) list.innerHTML = '<p style="color:#808d9a; text-align:center; padding:15px;">Ваша корзина пуста</p>';
        }

        function applyPromo() {
            if(document.getElementById('promoInput').value.trim() === 'OZON2026') {
                discountMultiplier = 0.9; showCustomToast("🏷️ Промокод активирован! Скидка 10% применена."); renderCartItems();
            } else { alert("Неверный промокод"); }
        }

        function openPaymentModal() {
            let totalSum = 0;
            for (let id in cart) { totalSum += Math.floor(products.find(p => p.id == id).price * 0.85) * cart[id]; }
            totalSum = Math.floor(totalSum * discountMultiplier);
            if (totalSum === 0) { alert("Корзина пуста!"); return; }
            toggleCart(false); togglePayment(true);
            const city = document.getElementById('citySelect').value; const pvz = document.getElementById('pvzSelect').value;
            document.getElementById('paymentSum').innerText = `${totalSum.toLocaleString()} ₽`;
            document.getElementById('paymentTargetPvz').innerText = `Доставка: ПВЗ Ozon, г. ${city}, ${pvz}`;
        }

        function togglePayment(show) { document.getElementById('paymentModal').style.display = show ? 'flex' : 'none'; }
        function formatCardNumber(input) { let v = input.value.replace(/\D/g, ''); input.value = v.match(/.{1,4}/g)?.join(' ') || ''; }
        
        function processPayment() {
            if (document.getElementById('cardNumber').value.length < 19) { alert("Заполните карту!"); return; }
            alert("Обработка транзакции банком...");
            setTimeout(() => {
                alert("🎉 Оплата прошла успешно!\nВаш заказ уже собирается на складе Ozon.");
                cart = {}; updateCartCounter(); togglePayment(false);
            }, 1000);
        }

        updatePvzOptions(); renderProducts(products);
    </script>
</body>
</html>
