
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Портал с Озвучкой</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a0aec0;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #4facfe;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            box-shadow: 0 0 15px #00f2fe;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #203a43;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            outline: none;
        }

        .btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            padding: 15px 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .sound-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sound-card:hover {
            background: rgba(79, 172, 254, 0.1);
            border-color: #4facfe;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Говорящий ИИ-Сайт</h1>
    <p>Напишите текст, настройте параметры и нажмите кнопку</p>

    <div class="input-group">
        <textarea id="text-to-speak">Привет! Я твой новый крутой сайт с полноценной озвучкой текста. Напиши здесь что-нибудь другое, и я прочитаю это вслух!</textarea>
    </div>

    <div class="controls">
        <div class="control-item">
            <label for="voice-select">Голос (Язык):</label>
            <select id="voice-select"></select>
        </div>
        <div class="control-item">
            <label for="rate">Скорость речи:</label>
            <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
        </div>
    </div>

    <button class="btn" id="speak-btn">ОЗВУЧИТЬ ТЕКСТ</button>

    <div class="card-grid">
        <div class="sound-card" onclick="quickSpeak('Добро пожаловать на наш секретный портал!')">
            👋 Приветствие
        </div>
        <div class="sound-card" onclick="quickSpeak('Внимание! Зафиксирована хакерская атака. Шучу, всё в порядке.')">
            ⚠️ Тревога
        </div>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-to-speak');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const speakBtn = document.getElementById('speak-btn');

    let voices = [];

    // Загрузка доступных голосов в системе
    function populateVoiceList() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        voices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-lang', voice.lang);
            option.setAttribute('data-name', voice.name);
            
            // По умолчанию выбираем русский голос, если он есть
            if(voice.lang.includes('ru')) {
                option.selected = true;
            }
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Функция озвучки основного текста
    function speak() {
        if (synth.speaking) {
            synth.cancel(); // Если уже говорит, прерываем
        }
        
        if (textInput.value !== '') {
            const utterThis = new SpeechSynthesisUtterance(textInput.value);
            
            const selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute('data-name');
            voices.forEach((voice) => {
                if(voice.name === selectedVoiceName) {
                    utterThis.voice = voice;
                }
            });

            utterThis.rate = rateInput.value;
            synth.speak(utterThis);
        }
    }

    // Быстрая озвучка для интерактивных карточек
    function quickSpeak(text) {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        const selectedVoiceName = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
        
        if(selectedVoiceName) {
            voices.forEach((voice) => {
                if(voice.name === selectedVoiceName) utterThis.voice = voice;
            });
        }
        utterThis.rate = rateInput.value;
        synth.speak(utterThis);
    }

    speakBtn.addEventListener('click', speak);
</script>

</body>
</html>
