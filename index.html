<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой ИИ — Профессиональная Озвучка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d1117, #161b22);
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            color: #f0f6fc;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            text-align: center;
            margin-bottom: 25px;
        }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            color: #c9d1d9;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .char-count {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8rem;
            color: #8b949e;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .full-width {
            grid-column: span 2;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8b949e;
        }

        select {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            color: #c9d1d9;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #161b22;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #58a6ff;
            cursor: pointer;
        }

        .slider-value {
            font-size: 0.85rem;
            min-width: 30px;
            text-align: right;
            color: #f0f6fc;
        }

        .buttons-container {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #238636;
            color: #ffffff;
            flex-grow: 2;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-danger {
            background-color: #da3637;
            color: #ffffff;
            padding: 14px;
        }

        .btn-danger:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .btn:disabled {
            background-color: #30363d;
            color: #8b949e;
            border: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Голосовой ИИ-Движок</h1>
    <div class="subtitle">Студия озвучки текста в реальном времени</div>

    <div class="textarea-wrapper">
        <textarea id="text-input" placeholder="Введите или вставьте сюда текст для озвучки..." maxlength="1000">Привет! Это профессиональный веб-интерфейс для генерации речи. Вы можете настроить скорость, тембр и сохранить готовый файл.</textarea>
        <div class="char-count" id="char-counter">0 / 1000</div>
    </div>

    <div class="settings-grid">
        <div class="control-group full-width">
            <label for="voice-select">🎙️ Выберите доступный голос и язык:</label>
            <select id="voice-select">
                <option value="">Загрузка доступных голосов...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="rate">⚡ Скорость речи:</label>
            <div class="slider-container">
                <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1">
                <span class="slider-value" id="rate-val">1.0x</span>
            </div>
        </div>

        <div class="control-group">
            <label for="pitch">🎼 Высота тона (Тембр):</label>
            <div class="slider-container">
                <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1">
                <span class="slider-value" id="pitch-val">1.0</span>
            </div>
        </div>
    </div>

    <div class="buttons-container">
        <button class="btn btn-danger" id="stop-btn" title="Остановить">⏹️</button>
        <button class="btn btn-primary" id="speak-btn">🔊 Озвучить сейчас</button>
        <button class="btn btn-secondary" id="download-btn">📥 Скачать аудио (WAV)</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rate-val');
    const pitchVal = document.getElementById('pitch-val');
    const charCounter = document.getElementById('char-counter');
    
    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');
    const downloadBtn = document.getElementById('download-btn');

    let voices = [];

    // Обновление счетчика символов
    function updateCharCount() {
        charCounter.textContent = `${textInput.value.length} / 1000`;
    }
    textInput.addEventListener('input', updateCharCount);
    updateCharCount();

    // Синхронизация ползунков с цифрами
    rateInput.addEventListener('input', () => rateVal.textContent = `${rateInput.value}x`);
    pitchInput.addEventListener('input', () => pitchVal.textContent = pitchInput.value);

    // Подгрузка голосов операционной системы (Google, Microsoft, Apple)
    function loadVoices() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        if (voices.length === 0) {
            const option = document.createElement('option');
            option.textContent = "Голоса не найдены. Попробуйте обновить страницу.";
            voiceSelect.appendChild(option);
            return;
        }

        // Сортируем: сначала русский, потом английский, потом остальные
        voices.sort((a, b) => {
            if (a.lang.includes('ru') && !b.lang.includes('ru')) return -1;
            if (!a.lang.includes('ru') && b.lang.includes('ru')) return 1;
            return a.lang.localeCompare(b.lang);
        });

        voices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-name', voice.name);
            option.setAttribute('data-lang', voice.lang);
            voiceSelect.appendChild(option);
        });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Запуск озвучки
    function speak() {
        if (synth.speaking) synth.cancel();

        if (textInput.value.trim() === '') return;

        const utterance = new SpeechSynthesisUtterance(textInput.value);
        const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
        
        const targetVoice = voices.find(v => v.name === selectedOption);
        if (targetVoice) utterance.voice = targetVoice;

        utterance.rate = rateInput.value;
        utterance.pitch = pitchInput.value;

        synth.speak(utterance);
    }

    // Скачивание аудиофайла через экспериментальный MediaRecorder (Запись системного аудио)
    // Работает через захват звукового потока синтезатора, если поддерживается
    function downloadAudio() {
        alert("Запуск конвертации! Пожалуйста, прослушайте фразу до конца для сохранения файла.");
        
        const chunks = [];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const destination = audioCtx.createMediaStreamDestination();
