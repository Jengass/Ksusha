
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 Генератор Абсурдных Предсказаний</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e0d33, #3b145a);
            color: white;
            text-align: center;
            transition: background 0.5s ease;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff00ff;
        }

        .prediction-box {
            font-size: 1.5rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-weight: bold;
            line-height: 1.4;
        }

        button {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(127, 0, 255, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .counter {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔮 Магический Шар 3000</h1>
        <p>Узнай, что ждет тебя в ближайший час!</p>
        
        <div class="prediction-box" id="prediction">
            Нажми на кнопку, чтобы активировать матрицу судьбы...
        </div>

        <button onclick="generatePrediction()">Узнать Судьбу</button>
        <div class="counter">Предсказано судеб: <span id="count">0</span></div>
    </div>

    <script>
        let count = 0;

        const subjects = ["Кот твоего соседа", "Робот-пылесос", "Пакет с пакетами", "Нейросеть", "Твой левый тапок", "Голубь Геннадий", "Плюшевый мишка"];
        const actions = ["тайно замышляет", "случайно запишет трек про", "объявит войну", "подарит тебе килограмм", "начнет майнить крипту через", "пришлет странное мем-видео про"];
        const objects = ["мировое господство", "миску с борщом", "твои новые носки", "космических пришельцев", "акции Газпрома", "подозрительно спелый банан"];

        const colors = [
            "linear-gradient(135deg, #1e0d33, #3b145a)",
            "linear-gradient(135deg, #0d324d, #7f5a83)",
            "linear-gradient(135deg, #1f4037, #99f2c8)",
            "linear-gradient(135deg, #f12711, #f5af19)",
            "linear-gradient(135deg, #833ab4, #fd1d1d)"
        ];

        function generatePrediction() {
            // Генерация случайного предсказания
            const s = subjects[Math.floor(Math.random() * subjects.length)];
            const a = actions[Math.floor(Math.random() * actions.length)];
            const o = objects[Math.floor(Math.random() * objects.length)];
            
            const fullText = `${s} ${a} ${o}!`;
            
            // Вывод текста на экран
            const box = document.getElementById("prediction");
            box.innerText = fullText;

            // Меняем фоновый цвет сайта
            document.body.style.background = colors[Math.floor(Math.random() * colors.length)];

            // Увеличиваем счетчик кликов
            count++;
            document.getElementById("count").innerText = count;

            // Озвучка текста (Web Speech API)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Прерываем прошлую озвучку
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
